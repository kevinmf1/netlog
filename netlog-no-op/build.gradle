plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'io.github.kevinmf1.netlog.noop'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    publishing { singleVariant('release') }
}
dependencies { api 'com.squareup.okhttp3:okhttp:4.12.0' }
afterEvaluate {
    publishing { publications { release(MavenPublication) { from components.release; artifactId = 'netlog-no-op' } } }
}
